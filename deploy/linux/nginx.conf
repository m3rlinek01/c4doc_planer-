# C4 GuestPass za istniejącym nginx (zamiast Caddy z install.sh --domain).
#   sudo cp nginx.conf /etc/nginx/sites-available/c4guestpass
#   sudo ln -s /etc/nginx/sites-available/c4guestpass /etc/nginx/sites-enabled/
#   (popraw server_name i ścieżki certyfikatu)  sudo nginx -t && sudo systemctl reload nginx
# W /etc/c4guestpass/c4guestpass.env: ASPNETCORE_URLS=http://127.0.0.1:8080, GuestPass__SecureCookies=true,
# ASPNETCORE_FORWARDEDHEADERS_ENABLED=true; potem sudo systemctl restart c4guestpass.

server {
    listen 80;
    server_name guestpass.firma.pl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name guestpass.firma.pl;

    ssl_certificate     /etc/ssl/certs/guestpass.crt;     # np. certbot: /etc/letsencrypt/live/guestpass.firma.pl/fullchain.pem
    ssl_certificate_key /etc/ssl/private/guestpass.key;   #              /etc/letsencrypt/live/guestpass.firma.pl/privkey.pem

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    server_tokens off;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
